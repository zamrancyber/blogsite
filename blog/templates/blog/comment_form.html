<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Comment | MyBlog</title>

    <!-- Premium font pairing -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Playfair+Display:ital,wght@0,500..800;1,500..800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0a0b0f;
            --bg-secondary: #13161d;
            --surface: #1a1d27;
            --surface-hover: #222736;
            --border: rgba(255, 255, 255, 0.06);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #d4af37;
            --accent-light: #f3d779;
            --gradient: linear-gradient(135deg, #d4af37 0%, #b8962e 100%);
            --danger: #ef4444;
            --radius: 24px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(212, 175, 55, 0.08), transparent),
                radial-gradient(ellipse 40% 70% at 90% 80%, rgba(139, 92, 246, 0.04), transparent);
            background-attachment: fixed;
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', Georgia, serif;
            font-weight: 700;
        }

        .container { max-width: 800px; margin: 0 auto; padding: 0 1.5rem; }

        /* Glass Navigation */
        .navbar {
            background: rgba(10, 11, 15, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo a {
            font-size: 1.85rem;
            font-weight: 800;
            font-family: 'Playfair Display', serif;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .logo a::before {
            content: "✦";
            font-size: 1.4rem;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .nav-links {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .nav-links a,
        .nav-links button {
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            padding: 0.55rem 1.3rem;
            border-radius: 100px;
            transition: var(--transition);
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .nav-links a:hover,
        .nav-links button:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }
        .btn-primary {
            background: var(--gradient) !important;
            color: #0a0b0f !important;
            font-weight: 600 !important;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4);
            filter: brightness(1.05);
        }
        .btn-outline {
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            background: transparent !important;
            color: var(--text-secondary) !important;
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05) !important;
            border-color: var(--accent) !important;
            color: var(--accent) !important;
        }

        /* Form card */
        .form-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 2.5rem 2.2rem;
            margin: 3rem auto;
            max-width: 700px;
            box-shadow: 0 20px 30px -10px rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            backdrop-filter: blur(4px);
        }
        .form-card h2 {
            font-size: 2rem;
            margin-bottom: 1.8rem;
            background: linear-gradient(to right, #fff, var(--accent-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Django form rendering */
        .form-card form p {
            margin-bottom: 1.5rem;
        }
        .form-card label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: var(--text-secondary);
        }
        .form-card input,
        .form-card textarea,
        .form-card select {
            width: 100%;
            padding: 0.85rem 1.1rem;
            background: var(--bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.95rem;
            transition: var(--transition);
            outline: none;
        }
        .form-card input:focus,
        .form-card textarea:focus,
        .form-card select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
        }
        .form-card textarea {
            min-height: 150px;
            resize: vertical;
        }

        /* Buttons inside form */
        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }
        .btn-submit {
            background: var(--gradient);
            border: none;
            color: #0a0b0f;
            padding: 0.75rem 2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4);
        }
        .btn-cancel {
            display: inline-flex;
            align-items: center;
            padding: 0.75rem 2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-secondary);
            transition: var(--transition);
        }
        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .footer {
            text-align: center;
            border-top: 1px solid var(--border);
            padding: 2.5rem;
            color: var(--text-secondary);
            font-size: 0.85rem;
            background: var(--bg-secondary);
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="nav-inner">
        <div class="logo"><a href="{% url 'blog-home' %}">MyBlog</a></div>
        <div class="nav-links">
            <a href="{% url 'blog-home' %}">Home</a>
            {% if user.is_authenticated %}
                <a href="{% url 'profile' user.username %}">Profile</a>
                <a href="{% url 'post-create' %}" class="btn-primary">Write story</a>
                <form action="{% url 'logout' %}" method="post" style="margin:0">
                    {% csrf_token %}
                    <button type="submit" class="btn-outline">Sign out</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn-outline">Sign in</a>
            {% endif %}
        </div>
    </div>
</nav>

<main>
    <div class="form-card">
        <h2>Edit your comment</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <button type="submit" class="btn-submit">Update comment</button>
                <a href="{% url 'post-detail' object.post.pk %}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</main>

<footer class="footer">
    <p>© 2026 MyBlog — built with Django & love</p>
</footer>

</body>
</html>
