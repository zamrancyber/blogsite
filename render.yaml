services:
  - type: web
    name: myblog
    runtime: python
    plan: free
    buildCommand: './build.sh'
    startCommand: 'gunicorn myblog.wsgi:application'
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: 'False'
      - key: DATABASE_URL
        fromDatabase:
          name: myblog_db
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME # if using cloudinary
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: myblog_db
    plan: free
